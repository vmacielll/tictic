services:
  postgres:
    image: postgres:16-alpine
    container_name: ticktick-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticktick
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: ticktick-app
    ports:
      - '3333:3333'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticktick?schema=public
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refreshsecretkey}
      PORT: 3333
    depends_on:
      - postgres

volumes:
  pgdata:
