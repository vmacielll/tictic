name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpassword
          POSTGRES_DB: tictic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser -d tictic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pguser:pgpassword@localhost:5432/tictic_test
      JWT_SECRET: testsecret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify lockfile integrity (server)
        working-directory: ./server
        run: npm ci --frozen-lockfile

      - name: Verify lockfile integrity (web)
        working-directory: ./web
        run: npm ci --frozen-lockfile

      - name: Lint (server)
        working-directory: ./server
        run: npm run typecheck

      - name: Lint (web)
        working-directory: ./web
        run: npm run lint || true

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Run unit tests with coverage
        working-directory: ./server
        run: npm run test:coverage || true

      - name: Run integration tests
        working-directory: ./server
        run: npm run test -- --run src/integration/ || true