name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

jobs:
  # ── Lint ──
  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --frozen-lockfile
        working-directory: ./server
      - run: npx prisma generate --schema=src/infra/database/prisma/schema.prisma
        working-directory: ./server
      - run: npm run typecheck
        working-directory: ./server
      - run: npm run lint
        working-directory: ./server

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --frozen-lockfile
        working-directory: ./web
      - run: npm run lint
        working-directory: ./web

  # ── Unit Tests ──
  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpassword
          POSTGRES_DB: tictic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser -d tictic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pguser:pgpassword@localhost:5432/tictic_test
      JWT_SECRET: testsecret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --frozen-lockfile
        working-directory: ./server
      - run: npx prisma generate --schema=src/infra/database/prisma/schema.prisma
        working-directory: ./server
      - run: npm run test:coverage
        working-directory: ./server

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --frozen-lockfile
        working-directory: ./web
      - run: npm test
        working-directory: ./web

  # ── Gate: all checks must pass before Vercel deploys ──
  ci-passed:
    needs: [lint-server, lint-web, test-server, test-web]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
